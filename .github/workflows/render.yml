name: Deploy to Render

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Mejora 3: Despliegue automático al crear un tag (ej. v1.0.0)
  pull_request:
    branches:
      - main
    types:
      - closed # Mejora 1: Solo actúa cuando un PR se cierra/mergea

jobs:
  # Mejora 2: Ejecutar todas las pruebas antes del despliegue
  test:
    name: Run Test Suite
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      - name: Run fast test layers
        run: |
          pytest app/features/ --ignore-glob='*selenium*'
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

  deploy:
    name: Trigger Render Deploy
    needs: test # Requiere que el job 'test' haya pasado satisfactoriamente
    # Condiciones:
    # 1. Se ha creado un tag (ej. v1.0.0).
    # 2. Es un push directo a 'main'.
    # 3. O es un Pull Request a 'main' que ha sido formalmente mergeado.
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Render via Webhook
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -f "$deploy_url"